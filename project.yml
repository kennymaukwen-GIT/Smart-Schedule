# XcodeGen spec — run `xcodegen generate` on macOS (brew install xcodegen) to produce SmartSchedule.xcodeproj.
# Three processes share one App Group + one Keychain access group:
#   SmartSchedule (app) · SmartScheduleWidgets (Live Activity + Control Center) · SmartScheduleNotificationContent
name: SmartSchedule
options:
  bundleIdPrefix: com.smartschedule
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # UI strings are English source keys; Shared/Localization/Localizable.xcstrings adds zh-Hant. XcodeGen has no
  # knownRegions option: it collects regions from the .lproj folders it finds (Shared/Localization/zh-Hant.lproj).
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  configs:
    # Push environment per configuration. Signing also sets it from the provisioning profile: development profiles
    # use development, distribution profiles and TestFlight production (Apple: APS Environment Entitlement).
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # String(localized:) / Text("…") keys are extracted at build time and kept in sync with the String Catalog.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  # ───────────────────────────── Host app ─────────────────────────────
  SmartSchedule:
    type: application
    platform: iOS
    sources:
      # The privacy manifest is listed on its own so it is certainly a bundle resource.
      - path: App
        excludes: [PrivacyInfo.xcprivacy]
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartschedule.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Smart Schedule
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSMicrophoneUsageDescription: Smart Schedule listens when you hold the mic so you can speak a plan instead of typing it.
        NSSpeechRecognitionUsageDescription: Your spoken plan is transcribed to text before it is scheduled.
        BGTaskSchedulerPermittedIdentifiers: [com.smartschedule.refresh]
        UIBackgroundModes: [fetch, remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: com.smartschedule.deeplink
            CFBundleURLSchemes: [smartschedule]
          - CFBundleURLName: com.smartschedule.google-oauth
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        SSKeychainAccessGroup: $(AppIdentifierPrefix)com.smartschedule.shared
        SSGoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        SSGoogleReversedClientID: $(GOOGLE_REVERSED_CLIENT_ID)
        SSGeminiBaseURL: $(GEMINI_BASE_URL)
        SSGeminiModelID: $(GEMINI_MODEL_ID)
        SSGeminiAPIKey: $(GEMINI_API_KEY)
        # Placeholders shown in Settings › About and the account sheet; replace before submitting.
        SSTermsURL: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/
        SSPrivacyURL: https://example.com/privacy
        SSSupportEmail: support@smart-schedules.com
    entitlements:
      path: App/SmartSchedule.entitlements
      properties:
        com.apple.security.application-groups: [group.com.smartschedule.shared]
        keychain-access-groups: [$(AppIdentifierPrefix)com.smartschedule.shared]
        com.apple.developer.usernotifications.time-sensitive: true
        aps-environment: $(APS_ENVIRONMENT)
    dependencies:
      - target: SmartScheduleWidgets
      - target: SmartScheduleNotificationContent
    scheme:
      testTargets:
        - SmartScheduleCoreTests
      # Local StoreKit testing for the Smart Schedule Pro products when run from Xcode (not bundled).
      storeKitConfiguration: Config/SmartSchedule.storekit

  # ───────────── Widget extension: Live Activity / Dynamic Island + Control Center ─────────────
  SmartScheduleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: [PrivacyInfo.xcprivacy]
      - path: Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared/Core
      - Shared/Models
      - Shared/Storage
      - Shared/LiveActivity
      - Shared/Intents
      - Shared/DesignSystem
      - Shared/Localization   # each extension resolves strings from its own bundle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartschedule.app.widgets
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Smart Schedule
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SSKeychainAccessGroup: $(AppIdentifierPrefix)com.smartschedule.shared
    entitlements:
      path: Widgets/SmartScheduleWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.smartschedule.shared]
        keychain-access-groups: [$(AppIdentifierPrefix)com.smartschedule.shared]

  # ───────────── Notification Content Extension: "HOLD MESSAGE TO SPAWN" ─────────────
  SmartScheduleNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationContent
        excludes: [PrivacyInfo.xcprivacy]
      - path: NotificationContent/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared/Core
      - Shared/Models
      - Shared/Storage
      - Shared/AI
      - Shared/Calendar
      - Shared/Auth
      - Shared/Orchestrator
      - Shared/Notifications
      - Shared/DesignSystem
      - Shared/Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartschedule.app.notification-content
        SKIP_INSTALL: YES
    info:
      path: NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: Smart Schedule
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: [SS_EVENT_REMINDER, SS_COMPOSE]
            UNNotificationExtensionInitialContentSizeRatio: 0.75
            UNNotificationExtensionUserInteractionEnabled: true
            UNNotificationExtensionDefaultContentHidden: true
        SSKeychainAccessGroup: $(AppIdentifierPrefix)com.smartschedule.shared
        SSGoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        SSGeminiBaseURL: $(GEMINI_BASE_URL)
        SSGeminiModelID: $(GEMINI_MODEL_ID)
        SSGeminiAPIKey: $(GEMINI_API_KEY)
    entitlements:
      path: NotificationContent/SmartScheduleNotificationContent.entitlements
      properties:
        com.apple.security.application-groups: [group.com.smartschedule.shared]
        keychain-access-groups: [$(AppIdentifierPrefix)com.smartschedule.shared]

  # ───────────── Hostless unit tests: pure logic in Shared/, compiled straight into the bundle ─────────────
  # No TEST_HOST, so tests run without launching the app. Shared/Intents (the app/widget App Intents) is left
  # out; nothing else in Shared/ references it. Tests/fixtures ships as a "fixtures" folder inside the bundle.
  # Shared/Localization comes along, so the compiled catalog's zh-Hant.lproj sits in the test bundle; Bundle.main
  # is the test runner, so String(localized:) in tests still returns the English keys.
  SmartScheduleCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Unit
      - path: Shared
        excludes: ["Intents/**"]
      - path: Tests/fixtures
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartschedule.coretests
        GENERATE_INFOPLIST_FILE: YES
