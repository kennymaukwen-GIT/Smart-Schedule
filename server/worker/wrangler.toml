# Smart Schedule Worker — deploy steps in README.md. No secrets in this file (the KV namespace ID is not one).
# Production: `npm run deploy`. Development (simulator, X-Dev-Token): `npm run deploy:dev`, see [env.dev] below.
name = "smart-schedule-worker"
main = "src/index.ts"
compatibility_date = "2026-09-15"
# Served at https://smart-schedule-worker.<account subdomain>.workers.dev (the app's GEMINI_BASE_URL). Said
# explicitly so wrangler does not warn or decide on its own. No preview URLs: every uploaded version would get a
# public URL of its own with the same secrets and KV.
workers_dev = true
preview_urls = false
# Since wrangler 4.150.0, deploy uploads source maps (the full src/*.ts, comments included) unless this says otherwise.
# Kept off so a deploy uploads only the bundle, as it did before; the bundle is not minified, so stack traces in
# `wrangler tail` stay readable. [env.dev] inherits this setting.
upload_source_maps = false

# No cron in version 1.0: the app has no Live Activity push-to-start (AppConstants.pushToStartEnabled = false, no
# aps-environment) and uploads no registrations, and without the APNS_* secrets every run would only log
# server_misconfigured. `crons = []` also removes the cron trigger an earlier deploy made (it can take up to 15 minutes
# to stop). The /devices/push-to-start route stays. To turn push-to-start on in a later version: set the APNS_* secrets
# (README.md › APNs .p8 設定), then crons = ["* * * * *"] (every minute: send the push-to-start notifications that are
# due). test/config-sync.test.ts keeps this empty while project.yml has no aps-environment.
[triggers]
crons = []

# One KV namespace for everything (key prefixes chal:, key:, sess:, rl:, p2s:, p2sdead:, due:, claim:, sent:, apns:).
# "smart-schedule-worker-ss-kv", made by the first `wrangler deploy` (automatic provisioning). In a fork of this
# repo, delete the id line: the first deploy then makes a namespace in your account.
[[kv_namespaces]]
binding = "SS_KV"
id = "c4a254a6957942a0b0c2ff1e29f22db1"

# Atomic rate limiting without KV writes (Cloudflare Workers Rate Limiting). Keys: id:<identity> (per keyId / "dev";
# a session counts as its keyId), ip:<IPv4 or IPv6 /64> (/attest*), pre:<ip>:<keyId> (Bearer body reads).
# Keep simple.limit equal to RATE_LIMIT_PER_MIN. namespace_id is any positive integer you choose, unique among the
# rate limiters in your Cloudflare account. Without this binding the Worker falls back to KV counters.
[[ratelimits]]
name = "SS_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Worker logs: only the Worker's own console.log JSON lines (e.g. the reason an attestation was rejected), which never
# contain a request body, token or key. Invocation logs stay off: they would keep every request's URL and headers.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

[vars]
# Bundle IDs allowed to attest (comma-separated). Only the app: App Attest does not work in app extensions, so the
# notification extension uses a session token (POST /session) instead.
BUNDLE_IDS = "com.smartschedules.app"
# Must match the app's com.apple.developer.devicecheck.appattest-environment entitlement, which project.yml sets to
# "production" in every configuration (aaguid "appattest" + 7 zero bytes): App Store and TestFlight builds, and
# Xcode-installed Debug and Release builds on an iPhone. "development" (aaguid "appattestdevelop") would refuse them all.
APP_ATTEST_ENV = "production"
# "true" ONLY on a development deployment: then X-Dev-Token (= the SS_DEV_TOKEN secret) bypasses App Attest.
ALLOW_DEV_TOKEN = "false"
# Requests per identity (attested key, "dev", or client IP for /attest*) per UTC minute; also the number of failed
# authentications one IP may make per minute before it is refused without its body being read.
RATE_LIMIT_PER_MIN = "30"
APNS_BUNDLE_ID = "com.smartschedules.app"
# Must match the app build's aps-environment: "sandbox" (Xcode builds) or "production" (TestFlight / App Store).
# Only the cron uses it, and version 1.0 has neither (see [triggers]).
APNS_ENV = "production"
# Lifetime of the session tokens POST /session issues for the notification extension (seconds, >= 60; 7 days).
SESSION_TTL_SECONDS = "604800"
# Models a session token may call (POST /v1beta/models/<model>:generateContent only), comma-separated. Must include
# the GEMINI_MODEL_ID (Config/Base.xcconfig) of every app version still in use. Add the new ID and deploy the Worker
# before submitting the build that uses it (App Review tests the notification extension). Remove an old ID only once
# no supported build sends it, or Google has shut it down. Exact IDs only, never a prefix. (test/config-sync.test.ts
# fails when the current GEMINI_MODEL_ID is missing here.)
SESSION_MODELS = "gemini-3.8-flash"
# Session-authenticated generateContent calls per identity per UTC day (the extension makes 1-3 per reply).
SESSION_DAILY_LIMIT = "200"
# Successful attestations (new identities) per client IP per UTC day; IPv6 counted per /64. High because mobile
# carriers put many users behind one IPv4 address.
ATTEST_DAILY_PER_IP = "200"
# Gemini prices in USD per million tokens, used only for the `gemini_usage` log line (what each answer cost; see
# README "每次請求的實際成本"). Gemini 3.8 Flash until 31 Dec 2026: 0.75 / 0.075 / 3.75. From 1 Jan 2027 Google lists
# 1.50 / 0.15 / 7.50: change these three and deploy. Thinking tokens are billed as output.
GEMINI_INPUT_USD_PER_M = "0.75"
GEMINI_CACHED_USD_PER_M = "0.075"
GEMINI_OUTPUT_USD_PER_M = "3.75"

# Secrets — never in this file. They are kept across deploys (a deploy replaces the vars above, not secrets):
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put APPLE_TEAM_ID       10 characters (developer.apple.com › Membership details). Required:
#                                               the App ID checked during attestation is "<APPLE_TEAM_ID>.<bundleId>".
#   Not needed for version 1.0 (no push-to-start, no cron), only once push-to-start is turned on:
#   npx wrangler secret put APNS_KEY_ID         the .p8 key's Key ID           } Live Activity push-to-start
#   npx wrangler secret put APNS_TEAM_ID        the Team ID that owns the key  } (APNs token-based auth)
#   npx wrangler secret put APNS_PRIVATE_KEY < AuthKey_XXXXXXXXXX.p8
#   npx wrangler secret put SS_DEV_TOKEN        only where ALLOW_DEV_TOKEN = "true"
# A name cannot be both a var and a secret: these must not appear in [vars] (test/config-sync.test.ts checks).

# ---------------------------------------------------------------------------------------------------------------------
# Development Worker for Debug builds (optional: without it, Debug builds on an iPhone use the production Worker, which
# accepts them). The simulator has no App Attest, so it sends X-Dev-Token (SS_DEV_TOKEN in Config/Secrets.xcconfig,
# the same value as this Worker's SS_DEV_TOKEN secret), which only this Worker accepts; Xcode-installed builds on an
# iPhone attest in App Attest's production environment, as every build does (project.yml). A Worker of its own
# (smart-schedule-worker-dev), with its own KV namespace and secrets, so the production Worker never accepts a dev
# token. Bindings and vars are not inherited from the top level, so all of them are repeated here. observability is
# inherited, but an [env.dev.observability] table replaces the top-level one whole, so it is repeated in full too.
#   npm run deploy:dev
#   npx wrangler secret put GEMINI_API_KEY --env dev
#   npx wrangler secret put SS_DEV_TOKEN --env dev
#   npx wrangler secret put APPLE_TEAM_ID --env dev        (Debug builds on an iPhone, when GEMINI_BASE_URL[config=Debug] is this Worker)
# Push-to-start from a Debug build on an iPhone (a sandbox APNs token; only once the app turns it on, not in 1.0):
# also set APNS_KEY_ID, APNS_TEAM_ID and APNS_PRIVATE_KEY with --env dev, and crons = ["* * * * *"] below.
# Local: `npm run dev` runs this environment on http://localhost:8787 with the secrets in a git-ignored .dev.vars.
[env.dev]
name = "smart-schedule-worker-dev"
workers_dev = true
preview_urls = false

[env.dev.observability]
enabled = true

[env.dev.observability.logs]
invocation_logs = false

# No Live Activity pushes from the simulator; set crons = ["* * * * *"] when testing push-to-start on a device.
[env.dev.triggers]
crons = []

# Made by the first `npm run deploy:dev`.
[[env.dev.kv_namespaces]]
binding = "SS_KV"

[[env.dev.ratelimits]]
name = "SS_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[env.dev.vars]
BUNDLE_IDS = "com.smartschedules.app"
APP_ATTEST_ENV = "production"
ALLOW_DEV_TOKEN = "true"
RATE_LIMIT_PER_MIN = "30"
APNS_BUNDLE_ID = "com.smartschedules.app"
APNS_ENV = "sandbox"
SESSION_TTL_SECONDS = "604800"
SESSION_MODELS = "gemini-3.8-flash"
SESSION_DAILY_LIMIT = "200"
ATTEST_DAILY_PER_IP = "200"
GEMINI_INPUT_USD_PER_M = "0.75"
GEMINI_CACHED_USD_PER_M = "0.075"
GEMINI_OUTPUT_USD_PER_M = "3.75"
