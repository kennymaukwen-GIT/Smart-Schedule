# smart-schedules.com: the public home, privacy and support pages, as an assets-only Worker (no script).
# Only ./public is uploaded; this file and README.md stay out of the upload. Deploy steps: README.md in this folder.
# Run from the repo root with the wrangler that server/worker already has:
#   server/worker/node_modules/.bin/wrangler deploy -c site/wrangler.toml
name = "smart-schedules-site"
compatibility_date = "2026-09-15"
# Served only on the custom domain below: no platform hostname, no per-version preview URLs.
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
# /privacy serves privacy.html; /privacy.html and /privacy/ redirect to /privacy.
html_handling = "auto-trailing-slash"
# Unknown paths get public/404.html with status 404.
not_found_handling = "404-page"

# The apex domain. Needs smart-schedules.com to be an active zone in the same Cloudflare account; the first deploy
# then creates the DNS record and certificate. www → apex is a Redirect Rule in the dashboard (README.md).
[[routes]]
pattern = "smart-schedules.com"
custom_domain = true
