# XcodeGen spec — run `xcodegen generate` on macOS (brew install xcodegen) to produce SmartSchedule.xcodeproj.
# Three processes share one App Group + one Keychain access group:
#   SmartSchedule (app) · SmartScheduleWidgets (Live Activity + Control Center) · SmartScheduleNotificationContent
name: SmartSchedule
options:
  bundleIdPrefix: com.smartschedule
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # UI strings are English source keys; Shared/Localization/Localizable.xcstrings adds zh-Hant. XcodeGen has no
  # knownRegions option: it collects regions from the .lproj folders it finds (Shared/Localization/zh-Hant.lproj).
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  configs:
    # App Attest: production in every configuration. TestFlight and App Store builds always use production whatever this
    # says; Xcode-installed builds use it because of this value (Apple: "If instead you want to use the App Attest
    # production servers during development, … set the associated value to production"), so a Debug build on an iPhone
    # is accepted by the production Worker, and by the development one, which checks production too (wrangler.toml).
    # Apple's own pages disagree on the sandbox aaguid ("appattestdevelop" vs "appattestsandbox"); production avoids it.
    # server/worker/test/config-sync.test.ts keeps these values and both Workers' APP_ATTEST_ENV equal.
    # SS_DEV_TOKEN (Config/Secrets.xcconfig) only reaches Debug builds: Release forces it empty.
    # No push environment: version 1.0 uses no remote push (AppConstants.pushToStartEnabled and
    # liveActivityPushEnabled are false), so the app has no aps-environment entitlement. To turn push-to-start on in a
    # later version, add `APS_ENVIRONMENT: development` to both Debug and Release (development in every configuration,
    # so builds and archives signed with the automatic development profile match it; Distribute App re-signs with the
    # distribution profile, which sets production — never write production here), then
    # `aps-environment: $(APS_ENVIRONMENT)` to the app's entitlements and remote-notification to its UIBackgroundModes.
    # scripts/validate_schema.py checks the flags and these entries agree.
    Debug:
      APP_ATTEST_ENVIRONMENT: production
    Release:
      APP_ATTEST_ENVIRONMENT: production
      SS_DEV_TOKEN: ""
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # String(localized:) / Text("…") keys are extracted at build time and kept in sync with the String Catalog.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  # ───────────────────────────── Host app ─────────────────────────────
  SmartSchedule:
    type: application
    platform: iOS
    sources:
      # The privacy manifest is listed on its own so it is certainly a bundle resource.
      - path: App
        excludes: [PrivacyInfo.xcprivacy]
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartschedules.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Smart Schedules
        UILaunchScreen: {}
        # One scene only, but iOS 26 delivers the Control Center button's intent to the scene at launch (so Quick Capture
        # is open on the first frame) only with this on: "The App Intents framework requires support for multiple scenes
        # to dispatch app intents to your scene at launch time." RootView's handlesExternalEvents keeps everything in the
        # one scene. scripts/validate_schema.py (check 13).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Voice input (App/Voice/VoiceTranscriber.swift): asked on the first tap of the mic button. Speech is recognised
        # on the iPhone only (requiresOnDeviceRecognition); the app target only, the extensions have no microphone.
        # zh-Hant in Shared/Localization/zh-Hant.lproj/InfoPlist.strings; scripts/validate_schema.py (check 9).
        NSMicrophoneUsageDescription: Tap the mic to speak a plan instead of typing it. Your speech is turned into text on this iPhone; the audio is not saved or sent anywhere.
        NSSpeechRecognitionUsageDescription: Your speech is turned into text on this iPhone, so you can speak a plan instead of typing it. The audio is not saved or sent anywhere.
        # Departure reminders 「該出發了」 (App/Departure/DeviceLocation.swift, docs/SETTINGS.md §7.11): When In Use only,
        # asked the first time the user says where they need to be and when, asks when to leave, or asks how long a
        # trip takes. The location goes only to Google Maps (through the Smart Schedules server), as the starting point.
        # No Always key and no location background mode; the app target only. zh-Hant in Shared/Localization/zh-Hant.lproj/InfoPlist.strings;
        # scripts/validate_schema.py (check 14).
        NSLocationWhenInUseUsageDescription: When you ask when to leave or how long a trip takes, or tell the assistant where you need to be and when, Smart Schedules uses your location as the starting point and sends it through the Smart Schedules server to Google Maps to plan the route and travel time. Smart Schedules does not save your location.
        BGTaskSchedulerPermittedIdentifiers: [com.smartschedule.refresh]
        # fetch: the BGAppRefresh task (App/Sync/AppRefresh.swift). No remote-notification: version 1.0 receives no
        # pushes (AppConstants.pushToStartEnabled).
        UIBackgroundModes: [fetch]
        # Only HTTPS and hashing (exempt): no export-compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.smartschedule.deeplink
            CFBundleURLSchemes: [smartschedule]
          - CFBundleURLName: com.smartschedule.google-oauth
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        SSKeychainAccessGroup: $(AppIdentifierPrefix)com.smartschedule.shared
        SSGoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        SSGoogleReversedClientID: $(GOOGLE_REVERSED_CLIENT_ID)
        SSGeminiBaseURL: $(GEMINI_BASE_URL)
        SSGeminiModelID: $(GEMINI_MODEL_ID)
        # Debug only: lets the simulator (no App Attest) call the server. Empty in Release.
        SSDevToken: $(SS_DEV_TOKEN)
        # Shown in Settings › About and the account sheet. SSTermsURL is the terms page (site/public/terms.html, which
        # links Apple's standard EULA in its section 2); SSPrivacyURL is the policy in site/public/privacy.html. Both are
        # served at www.smart-schedules.com (site/README.md).
        SSTermsURL: https://www.smart-schedules.com/terms
        SSPrivacyURL: https://www.smart-schedules.com/privacy
        SSSupportEmail: support@smart-schedules.com
    entitlements:
      path: App/SmartSchedule.entitlements
      properties:
        com.apple.security.application-groups: [group.com.smartschedule.shared]
        keychain-access-groups: [$(AppIdentifierPrefix)com.smartschedule.shared]
        com.apple.developer.usernotifications.time-sensitive: true
        # No aps-environment: version 1.0 uses no remote push (see settings above). Local and Time Sensitive
        # notifications, Live Activities requested with pushType nil and iOS 26's scheduled start do not need it.
        com.apple.developer.devicecheck.appattest-environment: $(APP_ATTEST_ENVIRONMENT)
    # GEMINI_BASE_URL comes only from the git-ignored Config/Secrets.xcconfig: a Release build without a valid one
    # would ship an assistant that can never answer, so it fails here; Debug builds only warn (demo mode works).
    preBuildScripts:
      - name: Check GEMINI_BASE_URL
        basedOnDependencyAnalysis: false
        script: |
          url=${GEMINI_BASE_URL%/}
          case "$url" in
            *googleapis.com*) problem="points at Google, which would need an API key in the app" ;;
            *"<"*|*">"*|*" "*) problem="still holds the <…> placeholder from Config/Secrets.example.xcconfig" ;;
            https://*/v1beta) problem="" ;;
            http://localhost:*/v1beta|http://127.0.0.1:*/v1beta)
              if [ "$CONFIGURATION" = "Release" ]; then problem="is a Worker on this Mac"; else problem=""; fi ;;
            "") problem="is not set" ;;
            *) problem="is not https://<worker host>/v1beta (it is '$url')" ;;
          esac
          if [ -n "$problem" ]; then
            if [ "$CONFIGURATION" = "Release" ]; then
              echo "error: GEMINI_BASE_URL $problem. Set it in Config/Secrets.xcconfig: GEMINI_BASE_URL = https:/\$()/<worker host>/v1beta"
              exit 1
            fi
            echo "warning: GEMINI_BASE_URL $problem: the assistant cannot reach the Smart Schedules server (demo mode still works)."
          fi
    dependencies:
      - target: SmartScheduleWidgets
      - target: SmartScheduleNotificationContent
    scheme:
      testTargets:
        - SmartScheduleCoreTests
      # Local StoreKit testing for the Smart Schedules Pro products when run from Xcode (not bundled). Unused while
      # AppConstants.subscriptionsEnabled is false (version 1.0 sells nothing).
      storeKitConfiguration: Config/SmartSchedule.storekit

  # ───────────── Widget extension: Live Activity / Dynamic Island + Control Center ─────────────
  SmartScheduleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: [PrivacyInfo.xcprivacy]
      - path: Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared/Core
      - Shared/Models
      - Shared/Storage
      - Shared/LiveActivity
      - Shared/Intents
      - Shared/DesignSystem
      - Shared/Localization   # each extension resolves strings from its own bundle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartschedules.app.widgets
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Smart Schedules
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SSKeychainAccessGroup: $(AppIdentifierPrefix)com.smartschedule.shared
    entitlements:
      path: Widgets/SmartScheduleWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.smartschedule.shared]
        keychain-access-groups: [$(AppIdentifierPrefix)com.smartschedule.shared]

  # ───────────── Notification Content Extension: "HOLD MESSAGE TO SPAWN" ─────────────
  SmartScheduleNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationContent
        excludes: [PrivacyInfo.xcprivacy]
      - path: NotificationContent/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared/Core
      - Shared/Models
      - Shared/Storage
      - Shared/AI
      - Shared/Calendar
      - Shared/Auth
      - Shared/Security   # App Attest: the extension calls Smart Schedule's server itself
      - Shared/Orchestrator
      - Shared/Notifications
      - Shared/DesignSystem
      - Shared/Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartschedules.app.notification-content
        SKIP_INSTALL: YES
    # Linked explicitly. The extension uses no symbol of UserNotificationsUI (only its protocol and enums), so the
    # linker drops the framework `import UserNotificationsUI` merely auto-links; iOS then cannot find the extension's
    # context class (_UNNotificationContentExtensionVendorContext) and the long-pressed reminder stays a blank box at
    # the 0.75 initial size (seen on the owner's iPhone, 2026-10-18). scripts/validate_schema.py and CI check this.
    dependencies:
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
    info:
      path: NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: Smart Schedules
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: [SS_EVENT_REMINDER, SS_COMPOSE]
            UNNotificationExtensionInitialContentSizeRatio: 0.75
            UNNotificationExtensionUserInteractionEnabled: true
            UNNotificationExtensionDefaultContentHidden: true
        SSKeychainAccessGroup: $(AppIdentifierPrefix)com.smartschedule.shared
        SSGoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        SSGeminiBaseURL: $(GEMINI_BASE_URL)
        SSGeminiModelID: $(GEMINI_MODEL_ID)
        SSDevToken: $(SS_DEV_TOKEN)
    entitlements:
      path: NotificationContent/SmartScheduleNotificationContent.entitlements
      properties:
        com.apple.security.application-groups: [group.com.smartschedule.shared]
        keychain-access-groups: [$(AppIdentifierPrefix)com.smartschedule.shared]
        # No App Attest here: it does not work in app extensions. The extension sends the server session the app
        # keeps for it in the shared Keychain group (Shared/Security/AppAttestClient.swift).

  # ───────────── Hostless unit tests: pure logic in Shared/, compiled straight into the bundle ─────────────
  # No TEST_HOST, so tests run without launching the app. Shared/Intents (the app/widget App Intents) is left
  # out; nothing else in Shared/ references it. Tests/fixtures ships as a "fixtures" folder inside the bundle.
  # Shared/Localization comes along, so the compiled catalog's zh-Hant.lproj sits in the test bundle; Bundle.main
  # is the test runner, so String(localized:) in tests still returns the English keys.
  SmartScheduleCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Unit
      - path: Shared
        excludes: ["Intents/**"]
      - path: Tests/fixtures
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartschedule.coretests
        GENERATE_INFOPLIST_FILE: YES
