name: iOS CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema:
    name: Function schema + fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install jsonschema==4.23.0

      - name: Validate declarations and fixtures
        run: python -I scripts/validate_schema.py --print-payloads

      # Keys, private keys, a concrete Worker host and personal email addresses belong in Config/Secrets.xcconfig,
      # Worker secrets or placeholders, never in the repository.
      - name: No keys, Worker hosts or personal emails in tracked files
        run: python -I scripts/check_repo_hygiene.py

  worker:
    name: Worker typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # >= 22.12: tests run TypeScript through Node's type stripping

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The only trust anchor for App Attest must be Apple's own certificate, byte for byte. Until it is embedded
      # (npm run embed-root-ca), this prints Apple's current PEM and fingerprint; afterwards it fails on any
      # difference, so a swapped or edited certificate cannot pass CI.
      - name: Apple App Attestation Root CA matches Apple's
        run: |
          set -eu
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 -o /tmp/apple.pem \
            https://www.apple.com/certificateauthority/Apple_App_Attestation_Root_CA.pem
          openssl x509 -in /tmp/apple.pem -noout -subject -issuer -enddate -fingerprint -sha256
          node -e '
            const s = require("fs").readFileSync("src/apple-root-ca.ts", "utf8");
            const m = /APPLE_APP_ATTESTATION_ROOT_CA_PEM\s*=\s*`([^`]*)`/.exec(s);
            require("fs").writeFileSync("/tmp/embedded.pem", m ? m[1] : "");
          '
          if ! grep -q "BEGIN CERTIFICATE" /tmp/embedded.pem; then
            echo "::warning::The Apple App Attestation Root CA is not embedded yet; Apple's current certificate:"
            cat /tmp/apple.pem
            exit 0
          fi
          APPLE=$(openssl x509 -in /tmp/apple.pem -outform DER | sha256sum | cut -d' ' -f1)
          EMBEDDED=$(openssl x509 -in /tmp/embedded.pem -outform DER | sha256sum | cut -d' ' -f1)
          echo "Apple:    $APPLE"
          echo "Embedded: $EMBEDDED"
          if [ "$APPLE" != "$EMBEDDED" ]; then
            echo "::error::src/apple-root-ca.ts does not hold Apple's App Attestation Root CA"
            exit 1
          fi

  ios:
    name: Build + unit tests (simulator)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          # Beta/RC bundles are skipped unless they are the only ones installed.
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Generate Xcode project
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version || true
          xcodegen generate

      # Config/Secrets.xcconfig (git-ignored) as Secrets.example.xcconfig lays it out, with placeholder hosts: Release
      # builds get the production Worker and no dev token, Debug builds the development Worker, and the dev token only
      # reaches Debug simulator builds. The file is removed again before the real build.
      - name: Secrets.xcconfig layout resolves per configuration
        run: |
          set -euo pipefail
          trap 'rm -f Config/Secrets.xcconfig' EXIT
          printf '%s\n' \
            'GEMINI_BASE_URL = https:/$()/prod.invalid/v1beta' \
            'GEMINI_BASE_URL[config=Debug] = https:/$()/dev.invalid/v1beta' \
            'SS_DEV_TOKEN[config=Debug][sdk=iphonesimulator*] = ci-dev-token' > Config/Secrets.xcconfig
          setting() {  # configuration sdk name
            xcodebuild -project SmartSchedule.xcodeproj -target SmartSchedule -configuration "$1" -sdk "$2" \
              -showBuildSettings 2>/dev/null | awk -v k="$3" '$1 == k && $2 == "=" { sub(/^[^=]*= ?/, ""); print; exit }'
          }
          check() {  # configuration sdk name expected
            got=$(setting "$1" "$2" "$3")
            echo "$1 $2: $3 = '$got'"
            [ "$got" = "$4" ] || { echo "::error::$1 $2: $3 is '$got', expected '$4'"; exit 1; }
          }
          check Release iphoneos GEMINI_BASE_URL https://prod.invalid/v1beta
          check Release iphonesimulator GEMINI_BASE_URL https://prod.invalid/v1beta
          check Debug iphoneos GEMINI_BASE_URL https://dev.invalid/v1beta
          check Debug iphonesimulator GEMINI_BASE_URL https://dev.invalid/v1beta
          check Debug iphonesimulator SS_DEV_TOKEN ci-dev-token
          check Debug iphoneos SS_DEV_TOKEN ""
          check Release iphonesimulator SS_DEV_TOKEN ""
          check Release iphoneos SS_DEV_TOKEN ""

      - name: Pick simulator
        run: |
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          SIM_UDID=$(python3 -I - "$RUNNER_TEMP/devices.json" "$SDK_VERSION" <<'PY'
          import json, re, sys

          def version(text):
              return tuple(int(p) for p in re.findall(r"\d+", text)[:3])

          with open(sys.argv[1]) as fh:
              devices = json.load(fh)["devices"]
          sdk = version(sys.argv[2])

          candidates = []
          for runtime, entries in devices.items():
              match = re.search(r"SimRuntime\.iOS-([\d-]+)$", runtime)
              if not match:
                  continue
              rt = version(match.group(1).replace("-", "."))
              if rt < (18, 0):  # deployment target
                  continue
              # A runtime newer than the selected SDK may be unusable by this Xcode: rank those last,
              # nearest-to-SDK first.
              usable = rt[:2] <= sdk[:2]
              rank = rt if usable else tuple(-p for p in rt)
              for d in entries:
                  if d.get("isAvailable", True) and d["name"].startswith("iPhone"):
                      candidates.append((usable, rank, "Pro" in d["name"], d["name"], rt, d["udid"]))

          if not candidates:
              sys.exit("No available iPhone simulator on an iOS 18+ runtime")
          *_, name, rt, udid = max(candidates)
          print(f"Simulator: {name} (iOS {'.'.join(map(str, rt))}) {udid}", file=sys.stderr)
          print(udid)
          PY
          )
          test -n "$SIM_UDID"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project SmartSchedule.xcodeproj \
            -scheme SmartSchedule \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Check privacy manifests are bundled
        run: |
          set -euo pipefail
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*/Build/Products/Debug-iphonesimulator/SmartSchedule.app" | head -1)
          test -n "$APP"
          for f in "$APP/PrivacyInfo.xcprivacy" \
                   "$APP/PlugIns/SmartScheduleWidgets.appex/PrivacyInfo.xcprivacy" \
                   "$APP/PlugIns/SmartScheduleNotificationContent.appex/PrivacyInfo.xcprivacy"; do
            test -f "$f" || { echo "::error::missing ${f#$APP/}"; exit 1; }
            plutil -lint "$f"
            grep -q "1C8F.1" "$f" || { echo "::error::${f#$APP/} does not declare the App Group UserDefaults reason"; exit 1; }
            echo "bundled: ${f#$APP/}"
          done

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SmartSchedule.xcodeproj \
            -scheme SmartSchedule \
            -destination "id=$SIM_UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build.log
            test.log
            TestResults.xcresult
          if-no-files-found: ignore

      # Kept last so the digest is the final thing in the job log.
      - name: Error digest
        if: failure()
        run: |
          # xcodebuild repeats each diagnostic several times, so identical lines are collapsed.
          DIGEST=$(grep -hE "error:|fatal error|[Tt]est [Cc]ase .* failed|\*\* (BUILD|TEST) FAILED \*\*|Testing failed:" \
            build.log test.log 2>/dev/null | awk '!seen[$0]++' | head -300 || true)
          if [ -z "$DIGEST" ]; then
            DIGEST="No compiler or test errors matched; see the full step logs or the ios-build-logs artifact."
          fi
          echo "$DIGEST"
          {
            echo "### iOS build/test errors"
            echo '```'
            echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
